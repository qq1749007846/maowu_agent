services:
  # MaoWu Agent 核心智能体与工作记忆引擎
  maowu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: maowu-agent:latest
    container_name: maowu_agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPENAI_API_BASE=https://model-api.datagrand.com/v1
      - DEFAULT_MODEL=openai/deepseek-v4-pro
    volumes:
      # 持久化长期记忆库 (data/ltm.db) 与提示词配置
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - maowu_net

  # AstrBot 可视化面板与多平台机器人网关
  astrbot:
    image: docker.m.daocloud.io/soulter/astrbot:latest
    container_name: astrbot
    restart: always
    ports:
      - "6185:6185"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 持久化 AstrBot 配置文件与登录凭据
      - ./astrbot_data:/AstrBot/data
    depends_on:
      maowu-agent:
        condition: service_healthy
    networks:
      - maowu_net

networks:
  maowu_net:
    driver: bridge
