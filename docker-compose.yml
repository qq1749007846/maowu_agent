services:
  # MaoWu Agent 核心认知与记忆引擎
  maowu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: maowu-agent:latest
    container_name: maowu_agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # 持久化长期记忆库 (ltm.db) 和 自定义提示词
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AstrBot 可视化面板与 QQ 协议网关
  astrbot:
    image: m.daocloud.io/docker.io/soulter/astrbot:latest
    container_name: astrbot
    restart: always
    ports:
      - "6185:6185"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 持久化 AstrBot QQ 登录凭据与客户端配置
      - ./astrbot_data:/AstrBot/data
    depends_on:
      maowu-agent:
        condition: service_healthy
