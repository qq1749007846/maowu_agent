services:
  maowu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: maowu-agent:latest
    container_name: maowu_agent
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # 持久化长期记忆库 (ltm.db) 和 自定义提示词
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
